# A few thousand steps, to check the pipeline end to end (README.md, "Check it works").
# Same as karen_ppo.yaml but small; nothing it learns means anything.
behaviors:
  Karen:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 256
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    behavioral_cloning:
      demo_path: demos
      strength: 0.5
      steps: 1000
    time_horizon: 32
    max_steps: 600
    summary_freq: 200
    checkpoint_interval: 600

engine_settings:
  time_scale: 1
  capture_frame_rate: 15
  target_frame_rate: -1
  no_graphics: true

torch_settings:
  device: cpu
