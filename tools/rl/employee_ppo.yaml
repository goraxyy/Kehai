# PPO for the simulated players' trained mind (0.4.0, build plan §7, C2.5). One behaviour,
# "Employee", plays every persona: the persona is in its observation and sets its reward's weights
# (EmployeeObservation, EmployeeReward). Three choices at once (what 14, how 3, which 3), masked.
#
#   tools/rl/train.sh employee_r1 2 tools/rl/employee_ppo.yaml --env-args -league tools/rl/leagues/employee_r1.json
#
# Round 1 (Employee-1) is about 1.0 M decisions; round 3 (Employee-2) 0.4 M more (§10.2).
behaviors:
  Employee:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 8192
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.0e-2              # keep its choices varied: the dice do the rest (§7.4)
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false          # EmployeeObservation is already scaled to −1..1
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # The warm start (§7.6): copy the scripted players first (efficient, skittish, reckless;
    # never cautious), recorded with record_demos.sh employee.
    behavioral_cloning:
      demo_path: demos/employee
      strength: 0.5
      steps: 200000
    time_horizon: 64
    max_steps: 1000000
    summary_freq: 10000
    checkpoint_interval: 50000
    keep_checkpoints: 10

# The three lessons (§7.6): the job with no Karen; the planner (rungs C and E); the league.
# The game reads "lesson" at each career (LeagueRunner.Lesson) and picks who it meets from the
# league file's "lessons".
environment_parameters:
  lesson:
    curriculum:
      - name: job
        completion_criteria:
          measure: reward
          behavior: Employee
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 0.4
        value: 0.0
      - name: planner
        completion_criteria:
          measure: reward
          behavior: Employee
          signal_smoothing: true
          min_lesson_length: 400
          threshold: 0.2
        value: 1.0
      - name: league
        value: 2.0

engine_settings:
  time_scale: 1                 # the game's own fixed step (1/15 s); see karen_ppo.yaml
  capture_frame_rate: 15
  target_frame_rate: -1
  no_graphics: true

torch_settings:
  device: cpu
