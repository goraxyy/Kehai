# Karen Vital's smoke run (C5.8): tiny, a few hundred decisions. Nothing it learns means anything.
# PPO for Karen Vital (0.4.0, build plan §5, §10, C5.5). One behaviour, "KarenVital": she picks an
# (action, trick) pair at the planner's decision moments; the plan's steps stay the planner's.
# Paid for catching you, sooner is better; pacing off (D4).
#
#   tools/rl/train.sh vital_r2_a 2 tools/rl/karen_vital.yaml --env-args -league tools/rl/leagues/vital_r2.json
#   tools/rl/train.sh vital_r2_b 2 tools/rl/karen_vital.yaml --env-args -league tools/rl/leagues/vital_r2.json -league-seed-offset 5000
# Two runs from two random starts (D12); checkpoints chosen on validation seeds, never test seeds.
behaviors:
  KarenVital:
    trainer_type: ppo
    hyperparameters:
      batch_size: 32
      buffer_size: 128
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false          # BrainObservation is already scaled
      hidden_units: 32
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # No warm start in the smoke run (C5.8): it checks the pipe, not the copying.
    time_horizon: 64
    max_steps: 300
    summary_freq: 100
    checkpoint_interval: 300
    keep_checkpoints: 20

engine_settings:
  time_scale: 1                 # the game's own fixed step (1/15 s); see karen_ppo.yaml
  capture_frame_rate: 15
  target_frame_rate: -1
  no_graphics: true

torch_settings:
  device: cpu
