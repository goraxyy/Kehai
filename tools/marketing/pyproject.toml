[project]
name = "kehai-marketing"
version = "0.1.0"
description = "Kehai's marketing pipeline: the asset library, the Claude writing steps and the voice (publishing comes in Phase 7). See README.md and docs/MARKETING.md."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "azure-cognitiveservices-speech>=1.52.0",
    "httpx>=0.28.1",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
